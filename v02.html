<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Time Tracker v0.2</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;background:#f5f4f1;color:#242424}*{box-sizing:border-box}body{margin:0}main{max-width:1420px;margin:auto;padding:24px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 18px}h3{margin:0 0 12px}small,.muted{color:#777}nav{display:flex;gap:4px;background:#eeece7;border-radius:30px;padding:5px;flex-wrap:wrap}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#eeece7;color:#222}button:hover{filter:brightness(.96)}button:disabled{opacity:.4;cursor:not-allowed}.active,.primary{background:#222;color:#fff}.danger{color:#bc3333}.card{background:white;border:1px solid #e5e2dc;border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f3f1ec;border-radius:14px;padding:14px}.metric strong{display:block;font-size:23px;margin-top:7px}.person{display:flex;gap:12px;align-items:center}.avatar{height:42px;width:42px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:700;background:#6366d9}.status{font-size:13px;border-radius:40px;padding:7px 10px;background:#e6f4eb;color:#167a4b}.clock{font-size:34px;font-weight:750;color:#299c6d;font-variant-numeric:tabular-nums}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.buttons button{font-size:13px}.panel{margin-top:18px}.timeline{display:flex;gap:8px;align-items:center;margin:10px 0}.track{position:relative;flex:1;height:27px;border-radius:8px;background:#efede8;overflow:hidden}.segment{position:absolute;height:100%;top:0}.work{background:#bfe9d3}.lunch{background:#f5a623}.break{background:#8f929e}.personal{background:#d641a2}.business{background:#398bf6}.unexplained{background:#e34848}.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:#777;margin-top:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #eee}th{color:#777;font-weight:500}.scroll{overflow-x:auto}input,select{padding:10px;border:1px solid #dedbd4;border-radius:10px;background:#fff;max-width:100%}label{display:block;font-size:13px;color:#777;margin-bottom:5px}.fields{display:flex;gap:12px;flex-wrap:wrap}.fields>div{flex:1;min-width:130px}.hidden{display:none!important}.warn{background:#fff2dc;color:#8a5709;padding:12px;border-radius:12px;margin-top:12px}.bar{display:flex;height:18px;border-radius:8px;overflow:hidden;background:#eee}.bar span{height:100%}.footer{font-size:12px;color:#777;margin-top:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.chartrow{display:flex;align-items:center;gap:10px;margin:10px 0}.chartrow .bar{flex:1}.nowrap{white-space:nowrap}@media(max-width:650px){main{padding:12px}.card{padding:16px}header{align-items:flex-start}.clock{font-size:30px}nav{width:100%}nav button{flex:1;padding:9px 5px;font-size:12px}}
</style></head><body><main><header><div><h1>Кто где <small>· Employee Time Tracker</small></h1><small>Командный трекер · локальный пилот v0.2</small></div><nav id="nav"><button data-tab="today" class="active">Сегодня</button><button data-tab="stats">Статистика</button><button data-tab="journal">Журнал</button><button data-tab="settings">Настройки</button></nav></header><section id="today" class="panel"></section><section id="stats" class="panel hidden"></section><section id="journal" class="panel hidden"></section><section id="settings" class="panel hidden"></section><div class="footer">Данные сохраняются только в этом браузере. Не используйте демонстрацию для кадровых решений без проверки данных и контекста.</div></main><script>
(()=>{'use strict';const KEY='ett_team_v02', $=id=>document.getElementById(id), reasons={lunch:'Обед',break:'Перекур / отдых',personal:'Личные дела',business:'По работе',unexplained:'Без объяснения'}, colors=['#5c5bdc','#14a89c','#e76f47','#9c60bd','#367bc8'];
const defaults=()=>({people:[],records:[],settings:{start:'10:00',end:'19:00',lunch:60,limit:30,grace:15},active:{}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaults();if(!Array.isArray(db.people)||!Array.isArray(db.records)||!db.settings||!db.active)throw Error()}catch{db=defaults()}
let tab='today',period=7,selectedDate=localDate(Date.now());
function localDate(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayStart(k){return new Date(k+'T00:00:00').getTime()}
function minutes(h){const [a,b]=h.split(':').map(Number);return a*60+b}
function fmt(ms){const n=Math.max(0,Math.floor(ms/60000));return Math.floor(n/60)+' ч '+n%60+' мин'}
function time(t){return new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function recordsFor(id,a,b){return db.records.filter(r=>r.person===id&&r.start<b&&(r.end??Date.now())>a)}
function duration(r,a,b){return Math.max(0,Math.min(r.end??Date.now(),b)-Math.max(r.start,a))}
function summarize(id,a,b){const rs=recordsFor(id,a,b);const s={work:0,lunch:0,break:0,personal:0,business:0,unexplained:0,excess:0,visits:0,days:0,late:0,early:0};const days={};for(const r of rs){const d=localDate(r.start);(days[d]??=[]).push(r);s[r.kind]=(s[r.kind]||0)+duration(r,a,b);if(r.kind!=='work'&&r.kind!=='business')s.visits++}s.days=Object.keys(days).length;for(const [day,items] of Object.entries(days)){const arrivals=items.filter(r=>r.kind==='work'||r.kind==='business').map(r=>r.start);if(arrivals.length){const first=Math.min(...arrivals),arrival=new Date(first);const m=arrival.getHours()*60+arrival.getMinutes();if(m>minutes(db.settings.start)+Number(db.settings.grace))s.late++}const lunch=items.filter(r=>r.kind==='lunch').reduce((n,r)=>n+duration(r,a,b),0);s.excess+=Math.max(0,lunch-Number(db.settings.lunch)*60000)}s.lost=s.break+s.personal+s.unexplained+s.excess;s.paid=s.work+s.business;return s}
function live(id){return db.active[id]||null}
function log(id,kind){const old=live(id),t=Date.now();if(old){const r=db.records.find(x=>x.id===old.recordId);if(r)r.end=t}if(kind){const r={id:uid(),person:id,kind,start:t,end:null};db.records.push(r);db.active[id]={recordId:r.id,kind}}else delete db.active[id];persist();render()}
function card(p){const a=dayStart(localDate(Date.now())),b=a+86400000,s=summarize(p.id,a,b),l=live(p.id),status=l?(l.kind==='work'?'На месте':l.kind==='business'?'По работе':reasons[l.kind]):'Не отмечен';return '<article class="card"><div class="row"><div class="person"><div class="avatar" style="background:'+p.color+'">'+esc(p.name.slice(0,1).toUpperCase())+'</div><strong>'+esc(p.name)+'</strong></div><span class="status">'+esc(status)+'</span></div><div class="row" style="margin:20px 0"><div><small>Рабочее время сегодня</small><div class="clock">'+fmt(s.paid)+'</div><small>На месте '+fmt(s.work)+'</small></div><div><small>Вне места</small><h2>'+fmt(s.lunch+s.break+s.personal+s.business+s.unexplained)+'</h2><small>Неучтённые '+fmt(s.lost)+'</small></div></div><div class="buttons"><button data-act="work" data-id="'+p.id+'" '+(l?.kind==='work'?'disabled':'')+'>▶ На месте</button>'+Object.entries(reasons).map(([k,v])=>'<button data-act="'+k+'" data-id="'+p.id+'" '+(l?.kind===k?'disabled':'')+'>'+esc(v)+'</button>').join('')+'<button data-act="stop" data-id="'+p.id+'" '+(!l?'disabled':'')+'>■ Завершить день</button></div></article>'}
function today(){const people=db.people.filter(p=>!p.archived),a=dayStart(localDate(Date.now())),b=a+86400000;let html='<div class="grid">'+(people.map(card).join('')||'<div class="card">Добавьте сотрудников во вкладке «Настройки».</div>')+'</div><article class="card panel"><h2>Лента дня</h2><small>Зелёный: на месте · синий: по работе · остальные цвета: причины отсутствий</small>';const low=a+8*3600000,high=a+20*3600000;for(const p of people){html+='<div class="timeline"><span style="width:90px;overflow:hidden;text-overflow:ellipsis">'+esc(p.name)+'</span><div class="track">';for(const r of recordsFor(p.id,low,high)){const from=Math.max(low,r.start),to=Math.min(high,r.end??Date.now());html+='<span title="'+esc((reasons[r.kind]||'На месте')+' '+time(from)+'–'+time(to))+'" class="segment '+r.kind+'" style="left:'+((from-low)/(high-low)*100)+'%;width:'+Math.max(0,(to-from)/(high-low)*100)+'%"></span>'}html+='</div></div>'}html+='<div class="row muted"><small>08:00</small><small>11:00</small><small>14:00</small><small>17:00</small><small>20:00</small></div></article>';$('today').innerHTML=html}
function stats(){const end=Date.now(),start=dayStart(localDate(end-period*86400000+86400000));let html='<div class="row"><h2>Аналитика команды</h2><div class="actions">'+[7,30].map(n=>'<button data-period="'+n+'" class="'+(period===n?'active':'')+'">'+n+' дней</button>').join('')+'<button data-export="csv">Выгрузить CSV</button></div></div><div class="grid">';for(const p of db.people.filter(p=>!p.archived)){const s=summarize(p.id,start,end),lost=Math.round(s.lost/60000),paid=s.paid;html+='<div class="card"><div class="person"><div class="avatar" style="background:'+p.color+'">'+esc(p.name[0])+'</div><h3>'+esc(p.name)+'</h3></div><div class="stats"><div class="metric"><small>Рабочее время</small><strong>'+fmt(paid)+'</strong></div><div class="metric"><small>На месте</small><strong>'+fmt(s.work)+'</strong></div><div class="metric"><small>Отсутствия всего</small><strong>'+fmt(s.lunch+s.break+s.personal+s.business+s.unexplained)+'</strong></div><div class="metric"><small>Учитываемые отсутствия</small><strong>'+fmt(s.lost)+'</strong></div><div class="metric"><small>Выходов</small><strong>'+s.visits+'</strong></div><div class="metric"><small>Опозданий*</small><strong>'+s.late+'</strong></div></div><div class="warn">Обед сверх нормы: '+fmt(s.excess)+'. Отсутствия без объяснения: '+fmt(s.unexplained)+'.</div></div>'}html+='</div><div class="card panel"><h2>Причины отсутствий за период</h2>';for(const p of db.people.filter(p=>!p.archived)){const s=summarize(p.id,start,end),total=s.lunch+s.break+s.personal+s.business+s.unexplained;html+='<div class="chartrow"><span style="width:100px">'+esc(p.name)+'</span><div class="bar">'+Object.keys(reasons).map(k=>'<span class="'+k+'" style="width:'+(total?s[k]/total*100:0)+'%" title="'+esc(reasons[k])+': '+fmt(s[k])+'"></span>').join('')+'</div><small>'+fmt(total)+'</small></div>'}html+='</div><p class="muted">* Опоздания рассчитаны по первой записи работы за день и общему времени начала дня. Выходные, смены, отпуска и праздники пока не учитываются. Показатели предварительные.</p>';$('stats').innerHTML=html}
function journal(){const a=dayStart(selectedDate),b=new Date(selectedDate+'T00:00:00');b.setDate(b.getDate()+1);const end=b.getTime(),rs=db.records.filter(r=>r.start<end&&(r.end??Date.now())>a).sort((x,y)=>x.start-y.start);let html='<div class="card"><div class="row"><h2>Журнал событий</h2><div class="actions"><input aria-label="Дата журнала" type="date" id="journalDate" value="'+selectedDate+'"><button class="primary" data-add="record">+ Добавить вручную</button></div></div><div class="scroll"><table><thead><tr><th>Сотрудник</th><th>Тип</th><th>Начало</th><th>Конец</th><th>Длительность</th><th>Действия</th></tr></thead><tbody>'+rs.map(r=>{const p=db.people.find(p=>p.id===r.person);return '<tr><td>'+esc(p?.name||'Архив')+'</td><td>'+esc(reasons[r.kind]||'На месте')+'</td><td>'+time(r.start)+'</td><td>'+(r.end?time(r.end):'Идёт')+'</td><td>'+fmt(duration(r,a,end))+'</td><td><button data-edit="'+r.id+'">Изменить</button><button class="danger" data-delete="'+r.id+'">Удалить</button></td></tr>'}).join('')+'</tbody></table></div></div>';$('journal').innerHTML=html}
function settings(){const s=db.settings;let html='<div class="card"><h2>Сотрудники</h2>'+db.people.map(p=>'<div class="inline"><span class="avatar" style="background:'+p.color+'">'+esc(p.name[0])+'</span><input aria-label="Имя сотрудника" data-name="'+p.id+'" value="'+esc(p.name)+'"><button data-save-name="'+p.id+'">Сохранить имя</button><button data-archive="'+p.id+'">'+(p.archived?'Восстановить':'В архив')+'</button></div>').join('')+'<div class="inline"><input id="newPerson" placeholder="Имя нового сотрудника" maxlength="80"><button class="primary" data-add="person">+ Добавить сотрудника</button></div></div><div class="card panel"><h2>Нормативы</h2><div class="fields">'+[['start','Начало дня','time'],['end','Конец дня','time'],['lunch','Норма обеда, мин','number'],['limit','Лимит отсутствий, мин','number'],['grace','Допуск опоздания, мин','number']].map(([k,title,type])=>'<div><label for="set_'+k+'">'+title+'</label><input id="set_'+k+'" type="'+type+'" value="'+esc(s[k])+'" '+(type==='number'?'min="0" max="1440"':'')+'></div>').join('')+'</div><div class="actions panel"><button class="primary" data-save="settings">Сохранить настройки</button><button data-export="json">Резервная копия JSON</button><button data-import="json">Импорт JSON</button><input class="hidden" id="importFile" type="file" accept="application/json,.json"></div><p class="muted">Норма рабочего дня в пилоте не рассчитывается автоматически из графика. Данные архива сохраняются для истории.</p></div>';$('settings').innerHTML=html}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['today','stats','journal','settings'].forEach(id=>$(id).classList.toggle('hidden',id!==tab));if(tab==='today')today();if(tab==='stats')stats();if(tab==='journal')journal();if(tab==='settings')settings()}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function editRecord(id){const r=db.records.find(x=>x.id===id);if(!r)return;if(!r.end){alert('Сначала завершите текущий интервал.');return}const start=prompt('Начало: ГГГГ-ММ-ДД ЧЧ:ММ',new Date(r.start).getFullYear()+'-'+String(new Date(r.start).getMonth()+1).padStart(2,'0')+'-'+String(new Date(r.start).getDate()).padStart(2,'0')+' '+time(r.start));if(start===null)return;const end=prompt('Конец: ГГГГ-ММ-ДД ЧЧ:ММ',localDate(r.end)+' '+time(r.end));if(end===null)return;const a=new Date(start.replace(' ','T')).getTime(),b=new Date(end.replace(' ','T')).getTime();if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a){alert('Некорректный интервал');return}r.start=a;r.end=b;persist();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.tab){tab=d.tab;render()}else if(d.period){period=Number(d.period);render()}else if(d.act){if(d.act==='stop'&&!confirm('Завершить день?'))return;log(d.id,d.act==='stop'?null:d.act)}else if(d.add==='person'){const name=$('newPerson').value.trim();if(!name)return;db.people.push({id:uid(),name,color:colors[db.people.length%colors.length],archived:false});persist();render()}else if(d.archive){const p=db.people.find(x=>x.id===d.archive);if(live(p.id)){alert('Сначала завершите день сотрудника.');return}p.archived=!p.archived;persist();render()}else if(d.saveName){const p=db.people.find(x=>x.id===d.saveName),name=document.querySelector('[data-name="'+p.id+'"]').value.trim();if(name){p.name=name;persist();render()}}else if(d.save==='settings'){for(const k of Object.keys(db.settings)){const v=$('set_'+k).value;if(k==='start'||k==='end')db.settings[k]=v;else db.settings[k]=Math.max(0,Math.min(1440,Number(v)||0))}persist();render()}else if(d.add==='record'){if(!db.people.length){alert('Сначала добавьте сотрудника');return}const id=prompt('Имя сотрудника:',db.people[0].name);if(id===null)return;const p=db.people.find(x=>x.name===id);if(!p){alert('Сотрудник не найден');return}const kind=prompt('Тип: work, lunch, break, personal, business, unexplained','break');if(!Object.keys(reasons).concat('work').includes(kind))return;const from=prompt('Начало (ЧЧ:ММ)','12:00'),to=prompt('Конец (ЧЧ:ММ)','12:15');if(!from||!to)return;const a=new Date(selectedDate+'T'+from).getTime(),z=new Date(selectedDate+'T'+to).getTime();if(!Number.isFinite(a)||!Number.isFinite(z)||z<=a){alert('Некорректный интервал');return}db.records.push({id:uid(),person:p.id,kind,start:a,end:z});persist();render()}else if(d.edit)editRecord(d.edit);else if(d.delete){if(!confirm('Удалить запись?'))return;const r=db.records.find(x=>x.id===d.delete);if(live(r.person)?.recordId===r.id)delete db.active[r.person];db.records=db.records.filter(x=>x.id!==r.id);persist();render()}else if(d.export==='json')download('employee-time-backup.json',JSON.stringify(db,null,2),'application/json');else if(d.export==='csv'){const rows=[['Сотрудник','Причина','Начало','Конец','Минуты'],...db.records.map(r=>[db.people.find(p=>p.id===r.person)?.name||'',reasons[r.kind]||'На месте',new Date(r.start).toLocaleString('ru-RU'),r.end?new Date(r.end).toLocaleString('ru-RU'):'',Math.round((Math.min(r.end??Date.now(),Date.now())-r.start)/60000)])];download('employee-time.csv','\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8');}else if(d.import==='json')$('importFile').click()});
document.addEventListener('change',async e=>{if(e.target.id==='journalDate'){selectedDate=e.target.value;render()}if(e.target.id==='importFile'){try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.people)||!Array.isArray(data.records)||!data.settings||!data.active)throw Error();if(confirm('Заменить текущие данные импортированными?')){db=data;persist();render()}}catch{alert('Неверный файл резервной копии')}}});
render();setInterval(()=>{if(tab==='today')today()},15000);
})();
</script></body></html>
